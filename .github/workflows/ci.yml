name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: zentrik_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentrik_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/zentrik_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zentrik_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-0123456789
      NEXT_PUBLIC_SITE_URL: https://zentriksolutions.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: Seed content for the production build
        run: npx prisma db seed
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
