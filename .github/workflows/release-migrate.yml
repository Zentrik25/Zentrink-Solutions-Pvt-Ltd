name: Release - database migration
# Manual, approval-gated. Never runs automatically on deploy.
on:
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: "Allow destructive statements (only after reviewing the SQL and verifying a backup)"
        type: boolean
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    env:
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install a PostgreSQL client matching the server's major version
        run: |
          MAJOR="$(psql "$DIRECT_URL" -Atc 'show server_version_num' | cut -c1-2)"
          echo "Server major version: $MAJOR"
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-$MAJOR"
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Guard against destructive migrations
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ inputs.allow_destructive && '1' || '0' }}
        run: npx tsx scripts/migration-guard.ts
      - name: Pre-migration backup (verified readable)
        run: ./scripts/backup.sh backups
      - name: Encrypt the backup (it contains personal data) and remove the plaintext
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Secret BACKUP_ENCRYPTION_PASSPHRASE is required"; exit 1; }
          pg_dump --version
          for f in backups/*.dump; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
                --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            sha256sum "$f.gpg" > "$f.gpg.sha256"
          done
          shred -u backups/*.dump backups/*.dump.sha256 2>/dev/null || rm -f backups/*.dump backups/*.dump.sha256
          ls -l backups
      - uses: actions/upload-artifact@v4
        with: { name: pre-migration-backup-encrypted, path: backups/, retention-days: 7 }
      - name: Apply migrations
        run: npx prisma migrate deploy
